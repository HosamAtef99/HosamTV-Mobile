name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://fvsueucybrxozrxglcye.supabase.co
      SB_SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Insert TMDB key (from the TMDB_KEY secret)
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          KEY=$(printf '%s' "$TMDB_KEY" | tr -cd 'A-Za-z0-9._-')
          if [ -n "$KEY" ]; then
            python3 -c "import sys;p='app/src/main/assets/www/tmdb.js';s=open(p).read();open(p,'w').write(s.replace('__TMDB_KEY__',sys.argv[1]))" "$KEY"
            echo "TMDB key inserted (${#KEY} chars)" | tee tmdb.log
          else echo "TMDB_KEY not set" | tee tmdb.log; fi
      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish the update for the in-app updater (Supabase Storage)
        if: success()
        run: |
          if [ -z "$SB_SECRET" ]; then echo "SUPABASE_SECRET_KEY secret not set - skipping" | tee upload.log; exit 0; fi
          CODE=$((100 + ${{ github.run_number }})); NAME="1.${{ github.run_number }}"
          APK=app/build/outputs/apk/release/app-release.apk
          {
            curl -sS -w " -> %{http_code}\n" -X POST "$SB_URL/storage/v1/object/releases/HosamTV-$CODE.apk" \
              -H "apikey: $SB_SECRET" -H "x-upsert: true" -H "Content-Type: application/vnd.android.package-archive" \
              --data-binary @"$APK"
            NOTES=$(git log -1 --pretty=%s | head -c 200 | python3 -c 'import json,sys;print(json.dumps(sys.stdin.read().strip()))')
            printf '{"versionCode":%s,"versionName":"%s","url":"%s","notes":%s}\n' "$CODE" "$NAME" \
              "$SB_URL/storage/v1/object/public/releases/HosamTV-$CODE.apk" "$NOTES" > latest.json
            cat latest.json
            curl -sS -w " -> %{http_code}\n" -X POST "$SB_URL/storage/v1/object/releases/latest.json" \
              -H "apikey: $SB_SECRET" -H "x-upsert: true" -H "Content-Type: application/json" -H "cache-control: max-age=30" \
              --data-binary @latest.json
          } 2>&1 | tee upload.log
      - name: Publish APK + logs to the "builds" branch
        if: always()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/HosamTV.apk 2>/dev/null || true
          cp build.log out/build.log 2>/dev/null || true
          cp upload.log out/upload.log 2>/dev/null || true
          cp tmdb.log out/tmdb.log 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/STATUS
          cd out
          git init -q
          git checkout -q -b builds
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
