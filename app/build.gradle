plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hosam.tvmobile'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hosam.tvmobile'
        minSdk 24
        targetSdk 34
        // every GitHub build gets a higher number, so the in-app updater can tell what's newer
        def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
        versionCode 100 + runNo
        versionName '1.' + runNo
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword 'hosamtv-2026'
            keyAlias 'hosamtv'
            keyPassword 'hosamtv-2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.core:core:1.13.1'
}
